spring.application.name=api-gateway

# Puerto del Gateway
server.port=8081

# Conexión al Config Server
spring.config.import=optional:configserver:http://localhost:8888

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Registro en Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Habilitar todos los endpoints de actuator
management.endpoints.web.exposure.include=*

# Configuración de rutas para nuestro API-Gateway (WebFlux)
spring.cloud.gateway.server.webflux.routes[0].id=pagos
spring.cloud.gateway.server.webflux.routes[0].uri=lb://microservice-pagos
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/pagos/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[1].id=demo
spring.cloud.gateway.server.webflux.routes[1].uri=lb://microservice-demo
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/demo/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=2
